name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  RUST_VERSION: "1.94.0"
  WASM_PACK_VERSION: "0.14.0"

jobs:
  core-and-web:
    name: Core, catalog, and PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-wasm-pack
        with:
          version: ${{ env.WASM_PACK_VERSION }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo check -p memory_pak_app --target wasm32-unknown-unknown
      - run: node scripts/build-slint-web.mjs
      - name: Reject source data and legacy assets
        run: |
          if find web/dist -type f \( -name '*.json' -o -name '*.svelte' -o -name 'tauri.conf.json' \) \
            ! -name 'manifest.webmanifest' | grep -q .; then
            echo "Runtime artifact contains source or legacy assets" >&2
            exit 1
          fi

  desktop:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.os }}
      - run: cargo build -p memory_pak_app --release --bin memory-pak

  android:
    name: Android emulator smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: cargo install cargo-ndk --locked
      - run: sdkmanager "ndk;27.2.12479018"
      - run: gradle -p platform/android :app:assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install -r platform/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.Aspenini.MemoryPak 1
            sleep 5
            adb shell pidof com.Aspenini.MemoryPak

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - run: brew install xcodegen
      - run: platform/ios/generate.bash
      - run: |
          xcodebuild \
            -project platform/ios/MemoryPak.xcodeproj \
            -scheme MemoryPak \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
