name: Package Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer for latest.json
        required: true
        default: "0.3.0"
      tag:
        description: GitHub release tag
        required: true
        default: "v0.3.0"

permissions:
  contents: read

env:
  MEMORY_PAK_UPDATER_PUBKEY: ${{ secrets.CARGO_PACKAGER_SIGN_PUBLIC_KEY }}
  CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
  CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            formats: nsis,wix
          - platform: macos
            runner: macos-latest
            formats: dmg,app
          - platform: linux
            runner: ubuntu-22.04
            formats: deb
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.platform }}
      - run: cargo install cargo-packager --locked
      - name: Validate signing configuration
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          test -n "$MEMORY_PAK_UPDATER_PUBKEY"
          test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY"
      - name: Package
        working-directory: crates/memory_pak_app
        run: cargo packager --release --formats ${{ matrix.formats }}
      - name: Linux portable archive
        if: matrix.platform == 'linux'
        run: |
          tar -C target/release -czf dist/desktop/Memory-Pak-linux-x86_64-portable.tar.gz memory-pak
      - uses: actions/upload-artifact@v5
        with:
          name: memory-pak-${{ matrix.platform }}
          path: dist/desktop/**
          if-no-files-found: error

  metadata:
    name: Release metadata
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: release-staging
          merge-multiple: true
      - run: |
          node scripts/stage-release-artifacts.mjs \
            --version "${{ inputs.version }}" \
            --tag "${{ inputs.tag }}" \
            --input release-staging \
            --output release-metadata
      - uses: actions/upload-artifact@v5
        with:
          name: memory-pak-release-metadata
          path: release-metadata/**
          if-no-files-found: error
