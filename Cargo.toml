[workspace]
members = [
    "crates/memory_pak_app",
    "crates/memory_pak_catalog",
    "crates/memory_pak_core",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Aspenini"]
license = "MIT"
repository = "https://github.com/Aspenini/Memory-Pak"
homepage = "https://aspenini.github.io/Memory-Pak"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "wasmbind"] }
blake3 = "1.8"
directories = "6.0"
parking_lot = "0.12"
postcard = { version = "1.0", default-features = false, features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
thiserror = "2.0"
unicode-normalization = "0.1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
slint = { version = "1.17.0", default-features = false }

# Keep the embedded catalog and Slint runtime compact across native and Wasm.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
